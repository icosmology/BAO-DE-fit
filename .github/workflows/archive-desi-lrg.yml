name: Archive full DESI DR1 LRG catalogues
on:
  push:
    branches:
      - chatgpt-desi-lrg-download-20260905
    paths:
      - .github/workflows/archive-desi-lrg.yml
      - catalogue_archive/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - filename: LRG_NGC_clustering.dat.fits
            bytes: 143196480
            label: NGC-data
          - filename: LRG_SGC_clustering.dat.fits
            bytes: 64272960
            label: SGC-data
          - filename: LRG_NGC_0_clustering.ran.fits
            bytes: 985916160
            label: NGC-random0
          - filename: LRG_SGC_0_clustering.ran.fits
            bytes: 520781760
            label: SGC-random0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FITS validator
        run: python -m pip install numpy astropy
      - name: Download original FITS and verify size, structure and rows
        run: python catalogue_archive/download_verify.py --filename '${{ matrix.filename }}' --bytes '${{ matrix.bytes }}'
      - name: Archive unchanged full catalogue and audit manifest
        uses: actions/upload-artifact@v4
        with:
          name: DESI-DR1-v1.5-LRG-${{ matrix.label }}
          path: catalogues/
          compression-level: 6
          retention-days: 90
          if-no-files-found: error
