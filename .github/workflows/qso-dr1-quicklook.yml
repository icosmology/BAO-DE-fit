name: QSO measured clustering quicklook
on:
  push:
    branches: [chatgpt-qso-dr1-analysis-20260908]
    paths: ['.github/workflows/qso-dr1-quicklook.yml']
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-qso-dr1-analysis-20260908
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: icosmology/BAO-DE-fit
          run-id: 34188293662
          name: QSO-full-direct-measurements
          path: measured
      - run: |
          mkdir -p qso_outputs quicklook
          cp measured/*.png measured/*.svg measured/*.csv measured/*summary.json qso_outputs/
          cp measured/*.png quicklook/
          git config user.name 'QSO analysis runner'
          git config user.email 'actions@users.noreply.github.com'
          git add qso_outputs
          git commit -m 'Archive actual QSO xi and first/second redshift derivatives'
          git pull --rebase origin chatgpt-qso-dr1-analysis-20260908
          git push origin HEAD:chatgpt-qso-dr1-analysis-20260908
          cat measured/measurement_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: QSO-actual-clustering-nine-figures
          path: quicklook/
          compression-level: 6
          retention-days: 90
