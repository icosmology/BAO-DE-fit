name: Full LRG final posterior and numerical audit
on:
  push:
    branches: [chatgpt-full-lrg-analysis-20260905]
    paths: [full_lrg/finalize_physical.py, .github/workflows/full-lrg-finalize.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  finish:
    strategy:
      fail-fast: false
      matrix:
        model: [linear, quadratic]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.3' scipy numba fitsio matplotlib camb emcee
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33949788858
          name: full-lrg-v15-differential-bao-results
          path: results
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33950476799
          name: full-lrg-kaiser-${{ matrix.model }}
          path: physical_results
      - name: Extend chains and validate final point estimates
        run: python full_lrg/finalize_physical.py --model ${{ matrix.model }} --steps 12000
      - name: Save reproduction code
        if: always()
        run: |
          mkdir -p final_results/reproduction
          cp full_lrg/*.py final_results/reproduction/
          python -m pip freeze > final_results/reproduction/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-lrg-final-${{ matrix.model }}
          path: final_results
          compression-level: 0
          retention-days: 90
  retain:
    needs: finish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-full-lrg-analysis-20260905
      - uses: actions/download-artifact@v4
        with:
          pattern: full-lrg-final-*
          merge-multiple: true
          path: final_results
      - name: Retain compact final products on the isolated branch
        run: |
          mkdir -p full_lrg_outputs
          find final_results -maxdepth 1 -type f \( -name '*.png' -o -name '*.svg' -o -name '*.json' -o -name '*.csv' -o -name '*.md' \) -exec cp {} full_lrg_outputs/ \;
          git config user.name 'DESI analysis workflow'
          git config user.email 'noreply@users.noreply.github.com'
          git add full_lrg_outputs
          git diff --cached --quiet || git commit -m 'Final full-LRG posterior summaries and curves after chain and optimizer checks'
          git push origin HEAD:chatgpt-full-lrg-analysis-20260905
      - uses: actions/upload-artifact@v4
        with:
          name: full-lrg-v15-final-physical-posterior
          path: final_results
          compression-level: 0
          retention-days: 90
