name: Direct DESI differential clustering

on:
  push:
    branches:
      - chatgpt-desi-differential-bao-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Restore analysis script byte-for-byte
        run: |
          cat direct_desi_analysis/script.b64.part* > /tmp/measure.b64
          base64 --decode /tmp/measure.b64 > direct_desi_analysis/measure_dxi_jackknife.py
          echo "2b8b95e34fe6394ab9891b5510f29c89b30b5f4675aa0580281f0f8b0eb5079e  direct_desi_analysis/measure_dxi_jackknife.py" | sha256sum --check
          python -m py_compile direct_desi_analysis/measure_dxi_jackknife.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2.3" scipy numba matplotlib fitsio

      - name: Validate pair counter and delete-one jackknife
        run: |
          python direct_desi_analysis/measure_dxi_jackknife.py --self-test --threads 4

      - name: Download public DESI DR1 LRG SGC and measure xi and dxi/dz
        run: |
          python direct_desi_analysis/measure_dxi_jackknife.py \
            --download \
            --cap SGC \
            --root results \
            --zmin 0.4 --zmax 1.1 \
            --smin 50 --smax 150 --ds 5 \
            --nmu 8 \
            --njack 20 \
            --threads 4 \
            --pivot 0.75 \
            --theta-cut 0.05 \
            --data-fraction 0.30 \
            --random-fraction 0.06 \
            --seed 73429

      - name: Record environment
        if: always()
        run: |
          mkdir -p results/SGC
          python --version > results/SGC/python_version.txt || true
          python -m pip freeze > results/SGC/pip_freeze.txt || true
          du -sh results || true
          find results/SGC -maxdepth 2 -type f -printf '%p %s bytes\n' | sort || true

      - name: Upload direct-catalogue products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desi-sgc-direct-dxi
          path: results/SGC
          if-no-files-found: error
          compression-level: 6
          retention-days: 3
