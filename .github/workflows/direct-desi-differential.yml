name: Direct DESI differential clustering
on:
  push:
    branches:
      - chatgpt-desi-differential-bao-20260904
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore tested original counter
        run: |
          cat direct_desi_analysis/script.b64.part* | base64 --decode > direct_desi_analysis/measure_dxi_jackknife.py
          echo '2b8b95e34fe6394ab9891b5510f29c89b30b5f4675aa0580281f0f8b0eb5079e  direct_desi_analysis/measure_dxi_jackknife.py' | sha256sum --check
          python -m py_compile direct_desi_analysis/extend_catalog.py
      - name: Install dependencies
        run: python -m pip install 'numpy<2.3' scipy numba matplotlib fitsio camb
      - name: Download exact matching public NGC catalogues
        run: |
          mkdir -p catalogs
          base='https://data.desi.lbl.gov/public/dr1/survey/catalogs/dr1/LSS/iron/LSScats/v1.2'
          curl -fL --retry 6 --retry-all-errors --connect-timeout 30 --max-time 1800 "$base/LRG_NGC_clustering.dat.fits" -o catalogs/LRG_NGC_clustering.dat.fits
          curl -fL --retry 6 --retry-all-errors --connect-timeout 30 --max-time 1800 "$base/LRG_NGC_0_clustering.ran.fits" -o catalogs/LRG_NGC_0_clustering.ran.fits
          echo 'bb00c32668f0f4155996fb9d22483cf30805ba5f35c8198b19ce6bc51bcc5a65  catalogs/LRG_NGC_clustering.dat.fits' | sha256sum --check
          echo '5f328d03d3c3a8a402b2948d191cd228257bb2ec0cb4886f06e92ef465c8a4ae  catalogs/LRG_NGC_0_clustering.ran.fits' | sha256sum --check
      - name: Measure first and second derivative ingredients
        run: python direct_desi_analysis/extend_catalog.py
      - name: Save runtime information
        if: always()
        run: |
          mkdir -p results_second/NGC
          python -m pip freeze > results_second/NGC/pip_freeze.txt
      - name: Upload second-order real-catalogue counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desi-ngc-second-order-real-counts
          path: results_second/NGC
          if-no-files-found: error
          retention-days: 7
