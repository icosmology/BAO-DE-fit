name: Full LRG v1.5 differential clustering
on:
  push:
    branches: [chatgpt-desi-lrg-v15-full-analysis-20260905]
    paths: [.github/workflows/full-lrg-v15.yml, full_lrg_v15/count.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '1'
  NUMBA_NUM_THREADS: '4'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.3' scipy numba fitsio
      - run: python full_lrg_v15/count.py --self-test
  count:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        cap: [NGC, SGC]
        task: [DDDR, RR0, RR1, RR2, RR3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.3' scipy numba fitsio
      - uses: actions/download-artifact@v4
        with:
          name: DESI-DR1-v1.5-LRG-${{ matrix.cap }}-data
          run-id: 33948207375
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: catalogues/data
      - uses: actions/download-artifact@v4
        with:
          name: DESI-DR1-v1.5-LRG-${{ matrix.cap }}-random0
          run-id: 33948207375
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: catalogues/random
      - name: Count all selected pairs without thinning
        run: python full_lrg_v15/count.py --cap '${{ matrix.cap }}' --task '${{ matrix.task }}' --input catalogues --output out
      - uses: actions/upload-artifact@v4
        with:
          name: full-lrg-v15-${{ matrix.cap }}-${{ matrix.task }}
          path: out/
          retention-days: 90
          if-no-files-found: error
          compression-level: 1
  reduce-and-fit:
    needs: count
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-desi-lrg-v15-full-analysis-20260905
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2.3' scipy numba fitsio matplotlib camb
      - uses: actions/download-artifact@v4
        with:
          pattern: full-lrg-v15-*
          path: counts
          merge-multiple: true
      - name: Reconstruct all moment statistics and fit independent BAO anchors and slopes
        run: |
          python full_lrg_v15/analyze.py --input counts --output results_v15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-lrg-v15-analysis-results
          path: results_v15/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
      - name: Publish plots and compact audit on analysis branch only
        if: success()
        run: |
          mkdir -p full_lrg_v15/results
          cp results_v15/*.png results_v15/*.svg results_v15/*.csv results_v15/*.json results_v15/*.md full_lrg_v15/results/
          git config user.name 'DESI analysis runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add full_lrg_v15/results
          git commit -m 'Save complete NGC+SGC catalogue measurements and diagnostic fits'
          git push origin HEAD:chatgpt-desi-lrg-v15-full-analysis-20260905
